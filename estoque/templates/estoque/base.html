{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Stock &amp; Roll{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'estoque/styles.css' %}" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand">Stock &amp; Roll</div>
        <nav>
          <a href="{% url 'dashboard' %}">Dashboard</a>
          <a href="{% url 'produto_list' %}">Produtos</a>
          <a href="{% url 'categoria_list' %}">Categorias</a>
          <a href="{% url 'produto_create' %}">Novo Produto</a>
          <a href="{% url 'movimentacao_create' %}">Movimentação</a>
          <a href="/admin/">Admin</a>
        </nav>
      </div>
    </header>

    <main class="container page-content">
      {% if messages %}
        <div class="messages">
          {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
