{% extends 'estoque/base.html' %}

{% block title %}Excluir categoria{% endblock %}

{% block content %}
  <section class="panel danger-panel">
    <h1>Excluir categoria</h1>
    <p>Tem certeza que deseja excluir <strong>{{ categoria.nome }}</strong>?</p>
    <p>Categorias que possuem produtos não podem ser excluídas.</p>

    <form method="post">
      {% csrf_token %}
      <div class="form-actions">
        <button type="submit" class="btn danger">Confirmar exclusão</button>
        <a class="btn secondary" href="{% url 'categoria_list' %}">Cancelar</a>
      </div>
    </form>
  </section>
{% endblock %}
