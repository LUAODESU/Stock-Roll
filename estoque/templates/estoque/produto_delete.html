{% extends 'estoque/base.html' %}

{% block title %}Excluir produto{% endblock %}

{% block content %}
  <section class="panel danger-panel">
    <h1>Excluir produto</h1>
    <p>Tem certeza que deseja excluir <strong>{{ produto.nome }}</strong>?</p>

    <form method="post">
      {% csrf_token %}
      <div class="form-actions">
        <button type="submit" class="btn danger">Confirmar exclusão</button>
        <a class="btn secondary" href="{% url 'produto_list' %}">Cancelar</a>
      </div>
    </form>
  </section>
{% endblock %}
